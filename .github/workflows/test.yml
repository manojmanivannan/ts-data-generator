name: test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test_py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        # `--all-packages` syncs the `tsdata` workspace member too, so its
        # fastapi dependency is installed — `tsdata/tests` is collected in CI
        # via `testpaths` (pyproject.toml) and needs it.
        run: uv sync --all-packages --all-extras

      - name: Run ruff check 🧹 (advisory)
        # Advisory gate: `continue-on-error` so the intentional D-violation
        # baseline (the 07+ do-phase docstring worklist) surfaces without
        # blocking PRs. Scope is the public package surface (the destination
        # enforces scoped `D` here, not on tests). Remove `continue-on-error`
        # to flip to a required gate once the surface passes `D` (ticket 08).
        continue-on-error: true
        run: uv run ruff check src/ts_data_generator

      - name: Run PyTest 🧪
        shell: bash
        # No explicit path arg: rely on `testpaths` (pyproject.toml) so the
        # scoped doctest collection (`--doctest-modules` on the 3 core modules)
        # runs in CI alongside the unit tests.
        run: |
          uv run -m pytest -vv
