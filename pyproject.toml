[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ts_data_generator"]
artifacts = ["src/ts_data_generator/data/*.json"]

[project]
name = "ts-data-generator"
version = "0.1.0"
description = "A Python library for generating synthetic time series data"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "pydantic>=2.0",
    "pydantic-ai>=0.4.3",
]
readme = "README.md"
authors = [{ name = "Manoj Manivannan", email = "manojm18@live.in" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "synthetic data",
    "data generator",
    "python",
    "time series",
    "data engineering",
]

[project.urls]
Repository = "https://github.com/manojmanivannan/ts-data-generator.git"
Issues = "https://github.com/manojmanivannan/ts-data-generator/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.3"]
holidays = ["holidays>=0.96"]
imputer = ["scipy>=1.7"]
plotting = ["matplotlib>=3.5"]
test = ["pytest>=7.0", "ruff>=0.3"]
all = [
    "holidays>=0.96",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.scripts]
tsdata = "ts_data_generator.cli:main"

[dependency-groups]
dev = ["marimo>=0.24.0"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "D",  # pydocstyle — enforces docs/docstrings.md (style guide, ticket 02)
]
# Google-style baseline ignores (see docs/docstrings.md). The docstring-presence rules
# (D100–D104) are intentionally KEPT: enforced across the public package surface as a required
# CI gate in test.yml.
ignore = [
    "D105", # magic methods: dunders need no docstring (style guide §1)
    "D107", # __init__: Args live on the class docstring, not __init__ (style guide §6)
    "D203", # blank-line-before-class conflicts with D211; Google style uses no blank line
    "D213", # multi-line-summary-second-line conflicts with D212; Google style puts summary first
]

[tool.ruff.lint.per-file-ignores]
# Internal modules — out of the user-facing public surface (style guide §5; scope Q2=b). `D` is
# not enforced here. Public surface (D enforced): the package __init__, data_gen, utils/functions,
# utils/trends, anomalies/*, schema/models, schema/__init__, plus analyzers/converter
# (SchemaConverter) and carriers (DimensionCarrier) per the gray-module decision (ticket 03).
"src/ts_data_generator/_version.py" = ["D"]
"src/ts_data_generator/aggregator.py" = ["D"]
"src/ts_data_generator/cli.py" = ["D", "E501"]  # internal; argparse help/example strings run long
"src/ts_data_generator/expand.py" = ["D"]
"src/ts_data_generator/plotting.py" = ["D"]
"src/ts_data_generator/random.py" = ["D"]
"src/ts_data_generator/exceptions.py" = ["D"]
"src/ts_data_generator/utils/__init__.py" = ["D"]
"src/ts_data_generator/utils/registry.py" = ["D"]
"src/ts_data_generator/schema/parser.py" = ["D"]
"src/ts_data_generator/schema/types.py" = ["D"]
"src/ts_data_generator/analyzers/__init__.py" = ["D"]
"src/ts_data_generator/core/**/*.py" = ["D"]
"src/ts_data_generator/data/**/*.py" = ["D"]
"src/ts_data_generator/transforms/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
# `--doctest-modules` collects `>>>` blocks from the files in `testpaths`.
# `testpaths` scopes doctest collection to the *core* docstring surface
# (ticket 04): `data_gen`, `utils.trends`, `utils.functions`. Other modules
# (`anomalies`, `schema/models`, `analyzers`, `utils/registry`, `random`)
# carry illustrative `>>>` blocks that are not CI doctests and are kept out
# by simply not listing their files here — see `docs/docstrings.md` §2/§3.
addopts = "-ra -q --doctest-modules"
testpaths = [
    "tests",
    "tsdata/tests",
    "src/ts_data_generator/data_gen.py",
    "src/ts_data_generator/utils/trends.py",
    "src/ts_data_generator/utils/functions.py",
]

[tool.uv.workspace]
members = ["tsdata"]

